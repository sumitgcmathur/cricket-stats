name: Update IPL Stats

on:
  schedule:
    # Runs every Tuesday and Friday at 6:30 AM IST (1:00 AM UTC)
    # Adjust days based on IPL match schedule
    - cron: '0 1 * * 2,5'
  workflow_dispatch:  # Also allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run data fetcher
        run: python fetch_ipl_data.py

      - name: Commit and push updated stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "📊 Auto-update IPL stats [$(date '+%d %b %Y')]"
          git push
