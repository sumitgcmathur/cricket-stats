name: Update Cricket Stats

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      competition:
        description: 'Competition code (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Fetch cricket data
        run: |
          if [ -n "${{ github.event.inputs.competition }}" ]; then
            python fetch_all_cricket.py --comp ${{ github.event.inputs.competition }}
          else
            python fetch_all_cricket.py --comp ipl tests odis t20is
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "📊 Auto-update cricket stats [$(date '+%d %b %Y')]"
          git fetch origin main
          git rebase origin/main
          git push origin main
