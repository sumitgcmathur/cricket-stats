# Nightly refresh of stats/ from Cricsheet (matches footer claim on index.html).
# Schedules only run on the repository default branch and can be disabled in:
#   Settings → Actions → General → Actions permissions / fork workflow runs

name: Update stats

on:
  workflow_dispatch:
  schedule:
    # 02:00 IST ≈ 20:30 UTC previous calendar day (India has no DST).
    - cron: '30 20 * * *'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Cricsheet data and rebuild stats
        run: python fetch_all_cricket.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore(stats): refresh from cricsheet ($(date -u +%Y-%m-%d))"
          git push
