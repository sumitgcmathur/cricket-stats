name: Update Cricket Stats

on:
  schedule:
    # Runs every day at 2:00 AM IST (8:30 PM UTC previous day)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      competition:
        description: 'Specific competition code (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Fetch all cricket data
        run: |
          if [ -n "${{ github.event.inputs.competition }}" ]; then
            python fetch_all_cricket.py --comp ${{ github.event.inputs.competition }}
          else
            python fetch_all_cricket.py
          fi

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add stats/
          git diff --staged --quiet || git commit -m "📊 Auto-update cricket stats [$(date '+%d %b %Y')]"
          git push origin main
